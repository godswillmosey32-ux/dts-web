<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Department Login</title>

<style>

body{
font-family:Arial, sans-serif;
background:#f4f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
width:350px;
border-radius:10px;
box-shadow:0 0 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
color:#4B0082;
}

input{
width:100%;
padding:12px;
margin:10px 0;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#00C2B8;
color:white;
border:none;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#4B0082;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Department Login</h2>

<form action="/login" method="POST">

<input
type="text"
name="login_id"
placeholder="Username / Registration Number / Staff ID"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
